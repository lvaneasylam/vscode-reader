<svg viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="warm" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="cool" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4338CA"/>
      <stop offset="1" stop-color="#312E81"/>
    </linearGradient>
  </defs>

  <!-- 飘起的书页：左暖右冷 -->
  <g transform="translate(330 190) rotate(-18)">
    <rect x="-75" y="-52" width="150" height="104" rx="14" fill="url(#warm)"/>
  </g>
  <g transform="translate(692 145) rotate(15)">
    <rect x="-75" y="-52" width="150" height="104" rx="14" fill="url(#cool)"/>
  </g>

  <!-- 书壳厚度 -->
  <path d="M 158 600 C 158 618 170 633 188 637 C 310 658 430 682 512 715 C 594 682 714 658 836 637 C 854 633 866 618 866 600 L 866 642 C 866 660 854 675 836 679 C 714 700 594 724 512 757 C 430 724 310 700 188 679 C 170 675 158 660 158 642 Z" fill="url(#shell)"/>

  <!-- 左页（暖）· 右页（冷） -->
  <path d="M 512 375 C 430 342 300 318 178 313 C 166 312.5 158 320 158 332 L 158 600 C 158 618 170 633 188 637 C 310 658 430 682 512 715 Z" fill="url(#warm)"/>
  <path d="M 512 375 C 594 342 724 318 846 313 C 858 312.5 866 320 866 332 L 866 600 C 866 618 854 633 836 637 C 714 658 594 682 512 715 Z" fill="url(#cool)"/>

  <!-- 中缝 -->
  <path d="M 512 375 L 512 715" stroke="rgba(30,27,75,.35)" stroke-width="10" stroke-linecap="round" fill="none"/>
  <path d="M 512 375 L 512 715" stroke="rgba(255,255,255,.25)" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- 文字线 -->
  <g stroke="rgba(255,255,255,.55)" stroke-width="17" stroke-linecap="round" fill="none">
    <path d="M 215 405 L 468 448"/>
    <path d="M 215 470 L 468 513"/>
    <path d="M 215 535 L 385 568"/>
    <path d="M 556 448 L 809 405"/>
    <path d="M 556 513 L 809 470"/>
    <path d="M 639 568 L 809 535"/>
  </g>
</svg>
